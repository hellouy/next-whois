name: keep-warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm page + query functions
        run: |
          BASE="${{ secrets.PROD_BASE_URL }}"
          warm() {
            curl -fsS -o /dev/null --max-time 25 "$@" || true
          }
          # Page SSR function
          warm "$BASE/"
          # Query function — nic.cn hits the CN-reserved short-circuit
          # (synthetic result, zero upstream WHOIS traffic)
          warm -H "Origin: $BASE" "$BASE/api/lookup-stream?query=nic.cn"
          # DB/Redis health probe
          warm -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$BASE/api/cron/ping"
          sleep 150
          warm "$BASE/"
          warm -H "Origin: $BASE" "$BASE/api/lookup-stream?query=nic.cn"
