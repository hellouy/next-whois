name: keep-warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production to keep instance warm
        run: |
          curl -fsS -o /dev/null \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 25 \
            "${{ secrets.PROD_BASE_URL }}/api/cron/ping" || true
