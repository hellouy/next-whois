name: prod-benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Measure production timings
        run: |
          BASE="${{ secrets.PROD_BASE_URL }}"
          ORIGIN="${{ secrets.PROD_BASE_URL }}"
          meas() {
            local label="$1"; local url="$2"
            curl -s -o /dev/null -H "Origin: $ORIGIN" -w "$label | dns=%{time_namelookup}s conn=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s code=%{http_code}\n" --max-time 40 "$url"
          }
          echo "=== Round 1: cold functions ==="
          meas "page /            " "$BASE/"
          meas "page /?q=example.com (SSR query)" "$BASE/?q=example.com"
          meas "health           " "$BASE/api/health"
          meas "lookup github.com (1st)" "$BASE/api/lookup?q=github.com"
          echo "=== Round 2: warm functions ==="
          meas "page / (warm)    " "$BASE/"
          meas "lookup github.com (2nd)" "$BASE/api/lookup?q=github.com"
          echo "=== Round 3: uncached domain first vs repeat ==="
          TS=$(date +%s)
          meas "lookup uncached 1st" "$BASE/api/lookup?q=bench${TS}.com"
          meas "lookup uncached 2nd" "$BASE/api/lookup?q=bench${TS}.com"
          echo "=== Round 4: after 90s idle (function freeze check) ==="
          sleep 90
          meas "lookup github.com (after idle)" "$BASE/api/lookup?q=github.com"
