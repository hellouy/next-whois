name: warm-diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check each warm endpoint
        run: |
          BASE="${{ secrets.PROD_BASE_URL }}"
          code() {
            curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$@"
          }
          echo "page        : $(code "$BASE/")"
          echo "lookup-stream: $(code -H "Origin: $BASE" "$BASE/api/lookup-stream?query=nic.cn")"
          echo "cron/ping   : $(code -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$BASE/api/cron/ping")"
